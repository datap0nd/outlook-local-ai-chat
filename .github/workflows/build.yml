name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore stable COM strong-name key
        shell: pwsh
        run: ./scripts/Restore-StrongNameKey.ps1

      - name: Build solution
        run: msbuild OutlookLocalAIChat.sln /m /p:Configuration=Release

      - name: Run guardrail tests
        run: tests\GuardrailTests\bin\Release\GuardrailTests.exe

      - name: Run static capability scan
        shell: pwsh
        run: ./scripts/Test-Guardrails.ps1

      - name: Inspect .NET COM registration contract
        shell: powershell
        run: |
          $assembly = Resolve-Path "src\OutlookLocalAIChat\bin\Release\OutlookLocalAIChat.dll"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\RegAsm.exe" `
            $assembly /codebase /regfile:managed-com.reg
          $registration = Get-Content managed-com.reg -Raw
          if (-not $registration.Contains("OutlookLocalAIChat.AddIn")) {
            throw "RegAsm did not export the add-in COM class."
          }
          if (-not $registration.Contains("PublicKeyToken=f51b005bfa6d7cc3")) {
            throw "The add-in strong-name identity changed."
          }
          if (-not $registration.Contains("OutlookLocalAIChat.UI.ChatPane")) {
            throw "The Outlook sidebar control was not exported to COM."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build single-file installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=1.1.2" `
            "installer\OutlookLocalAIChat.iss"

      - name: Smoke-test installer registration
        shell: powershell
        run: |
          $installer = Resolve-Path "artifacts\OutlookLocalAIChatSetup.exe"
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $installedDll = Join-Path $env:LOCALAPPDATA "Programs\OutlookLocalAIChat\OutlookLocalAIChat.dll"
          if (-not (Test-Path $installedDll)) {
            throw "Installed add-in DLL was not found."
          }
          $assembly = [Reflection.Assembly]::LoadFrom($installedDll)
          $instance = $assembly.CreateInstance("OutlookLocalAIChat.AddIn")
          if ($null -eq $instance) {
            throw "The installed add-in class could not be instantiated."
          }
          $clsid = "{0D6E56F9-BE2D-4B94-B5E4-4C2DB0FD13E7}"
          $paneClsid = "{14D24FA1-4342-442F-B68B-B68D7372794C}"
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $root = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser,
              $view)
            try {
              $addin = $root.OpenSubKey(
                "Software\Microsoft\Office\Outlook\Addins\OutlookLocalAIChat.AddIn")
              if ($null -eq $addin -or $addin.GetValue("LoadBehavior") -ne 3) {
                throw "Outlook add-in registration is missing in $view."
              }
              $server = $root.OpenSubKey(
                "Software\Classes\CLSID\$clsid\InprocServer32")
              if ($null -eq $server) {
                throw "COM registration is missing in $view."
              }
              $codeBase = [string]$server.GetValue("CodeBase")
              $codeBasePath = ([Uri]$codeBase).LocalPath
              if (-not (Test-Path $codeBasePath)) {
                throw "The $view COM codebase does not resolve to the installed DLL."
              }
              $paneServer = $root.OpenSubKey(
                "Software\Classes\CLSID\$paneClsid\InprocServer32")
              if ($null -eq $paneServer) {
                throw "Sidebar COM registration is missing in $view."
              }
              if ([string]$paneServer.GetValue("Class") -ne
                  "OutlookLocalAIChat.UI.ChatPane") {
                throw "Sidebar COM class is wrong in $view."
              }
            }
            finally {
              if ($null -ne $addin) { $addin.Dispose() }
              if ($null -ne $server) { $server.Dispose() }
              if ($null -ne $paneServer) { $paneServer.Dispose() }
              $root.Dispose()
            }
          }

          # GitHub-hosted runners execute as a non-interactive elevated service.
          # Windows intentionally ignores per-user COM classes in that context.
          # Register the installed DLL temporarily per-machine to exercise the
          # same managed class factory in both bitnesses, then remove it.
          # Remove the already-verified per-user class keys first so they cannot
          # mask the temporary machine registration in the runner context.
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $root = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser,
              $view)
            try {
              $root.DeleteSubKeyTree(
                "Software\Classes\CLSID\$clsid",
                $false)
              $root.DeleteSubKeyTree(
                "Software\Classes\OutlookLocalAIChat.AddIn",
                $false)
              $root.DeleteSubKeyTree(
                "Software\Classes\CLSID\$paneClsid",
                $false)
              $root.DeleteSubKeyTree(
                "Software\Classes\OutlookLocalAIChat.ChatPane",
                $false)
            }
            finally {
              $root.Dispose()
            }
          }
          $regasm64 = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\RegAsm.exe"
          $regasm32 = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\RegAsm.exe"
          try {
            & $regasm64 $installedDll /codebase
            if ($LASTEXITCODE -ne 0) { throw "64-bit RegAsm failed." }
            $addin64 = New-Object -ComObject OutlookLocalAIChat.AddIn
            if ($null -eq $addin64) { throw "64-bit COM activation failed." }
            if ([Runtime.InteropServices.Marshal]::IsComObject($addin64)) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin64)
            }
          }
          finally {
            & $regasm64 $installedDll /unregister
          }
          try {
            & $regasm32 $installedDll /codebase
            if ($LASTEXITCODE -ne 0) { throw "32-bit RegAsm failed." }
            $powershell32 = "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
            $smoke32 = Join-Path $env:RUNNER_TEMP "smoke-com-32.ps1"
            @'
          $addin32 = New-Object -ComObject OutlookLocalAIChat.AddIn
          if ($null -eq $addin32) { throw "32-bit COM activation failed." }
          if ([Runtime.InteropServices.Marshal]::IsComObject($addin32)) {
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin32)
          }
          '@ | Set-Content $smoke32 -Encoding ASCII
            & $powershell32 -NoProfile -File $smoke32
            if ($LASTEXITCODE -ne 0) { throw "32-bit COM activation failed." }
          }
          finally {
            & $regasm32 $installedDll /unregister
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookLocalAIChatSetup
          path: artifacts/OutlookLocalAIChatSetup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/OutlookLocalAIChatSetup.exe
          generate_release_notes: true
